<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtopic Mistake Tags – Three Student Sample</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        padding: 2.5rem clamp(1rem, 3vw, 3rem);
        background: inherit;
      }

      header {
        max-width: 960px;
        margin: 0 auto 2rem;
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(2rem, 3.5vw, 2.75rem);
      }

      header p {
        margin: 0.35rem 0;
        color: #475569;
        font-size: 1rem;
      }

      main {
        max-width: 960px;
        margin: 0 auto 4rem;
        display: grid;
        gap: 1.75rem;
      }

      article {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: clamp(1.25rem, 3vw, 2rem);
      }

      article h2 {
        margin-top: 0;
        margin-bottom: 0.25rem;
        font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      }

      .subheading {
        margin: 0;
        color: #64748b;
        font-size: 0.95rem;
      }

      .metric {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: #e2e8f0;
        color: #334155;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-size: 0.85rem;
        margin: 0.75rem 0 1.25rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.25rem;
      }

      thead {
        background: #eff6ff;
      }

      th,
      td {
        padding: 0.6rem 0.75rem;
        text-align: left;
        font-size: 0.95rem;
        border-bottom: 1px solid #e2e8f0;
      }

      th {
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.75rem;
        color: #475569;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(59, 130, 246, 0.12);
        color: #1d4ed8;
        border-radius: 999px;
        padding: 0.2rem 0.65rem;
        font-size: 0.85rem;
      }

      .student-breakdown {
        display: grid;
        gap: 0.5rem;
      }

      .student-breakdown h3 {
        margin: 0;
        font-size: 1rem;
        color: #334155;
      }

      .student-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        background: #f1f5f9;
        border-radius: 0.75rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
      }

      footer {
        max-width: 960px;
        margin: 3rem auto 0;
        color: #475569;
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        body {
          padding: 1.5rem 1rem 2.5rem;
        }

        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }

        thead {
          display: none;
        }

        tbody tr {
          border: 1px solid #e2e8f0;
          border-radius: 0.75rem;
          padding: 0.75rem;
          margin-bottom: 0.75rem;
          background: #f8fafc;
        }

        tbody td {
          border: none;
          padding: 0.25rem 0;
        }

        tbody td::before {
          content: attr(data-label) ": ";
          font-weight: 600;
          color: #475569;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Subtopic Mistake Tags</h1>
      <p id="student-summary">Loading student information…</p>
      <p id="dataset-note">Analysing incorrect attempts only.</p>
    </header>
    <main id="content" aria-live="polite"></main>
    <footer>
      The mistake tags reuse the existing taxonomy from <code>backend/app/ingest.py</code>.
    </footer>
    <script>
      async function loadData() {
        const response = await fetch("data/three_student_mistake_summary.json", {
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error(`Failed to load summary: ${response.status}`);
        }
        return response.json();
      }

      function formatTagCounts(tagCounts) {
        if (!tagCounts || tagCounts.length === 0) {
          return "—";
        }
        return tagCounts
          .map((entry) => `${entry.tag.replaceAll("_", " ")} (${entry.count})`)
          .join(", ");
      }

      function renderSubtopic(container, subtopic) {
        const article = document.createElement("article");

        const title = document.createElement("h2");
        title.textContent = subtopic.subtopic;
        article.appendChild(title);

        const subheading = document.createElement("p");
        subheading.className = "subheading";
        subheading.textContent = `${subtopic.topic} • ${subtopic.subject}`;
        article.appendChild(subheading);

        const metric = document.createElement("div");
        metric.className = "metric";
        metric.textContent = `Incorrect attempts analysed: ${subtopic.attempts_considered}`;
        article.appendChild(metric);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = "<tr><th>Mistake tag</th><th>Frequency</th></tr>";
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        if (subtopic.tag_counts.length === 0) {
          const emptyRow = document.createElement("tr");
          const emptyCell = document.createElement("td");
          emptyCell.colSpan = 2;
          emptyCell.textContent = "No mistake tags recorded.";
          emptyRow.appendChild(emptyCell);
          tbody.appendChild(emptyRow);
        } else {
          subtopic.tag_counts
            .slice()
            .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag))
            .forEach((entry) => {
              const row = document.createElement("tr");

              const tagCell = document.createElement("td");
              tagCell.dataset.label = "Mistake tag";
              const tagSpan = document.createElement("span");
              tagSpan.className = "tag-pill";
              tagSpan.textContent = entry.tag.replaceAll("_", " ");
              tagCell.appendChild(tagSpan);

              const countCell = document.createElement("td");
              countCell.dataset.label = "Frequency";
              countCell.textContent = entry.count;

              row.appendChild(tagCell);
              row.appendChild(countCell);
              tbody.appendChild(row);
            });
        }
        table.appendChild(tbody);
        article.appendChild(table);

        const studentSection = document.createElement("section");
        studentSection.className = "student-breakdown";

        const studentHeading = document.createElement("h3");
        studentHeading.textContent = "Student mistake tag breakdown";
        studentSection.appendChild(studentHeading);

        subtopic.students.forEach((student) => {
          const row = document.createElement("div");
          row.className = "student-row";
          const idSpan = document.createElement("span");
          idSpan.textContent = `Student ${student.student_id}`;
          row.appendChild(idSpan);

          const tagsSpan = document.createElement("span");
          tagsSpan.textContent = formatTagCounts(student.tag_counts);
          row.appendChild(tagsSpan);

          studentSection.appendChild(row);
        });

        article.appendChild(studentSection);
        container.appendChild(article);
      }

      async function init() {
        const main = document.getElementById("content");
        const studentSummary = document.getElementById("student-summary");
        const datasetNote = document.getElementById("dataset-note");

        try {
          const data = await loadData();
          studentSummary.textContent = `Selected students: ${data.selected_students
            .map((id) => `#${id}`)
            .join(", ")}`;

          const excluded = data.students_present.filter(
            (id) => !data.selected_students.includes(id)
          );
          if (excluded.length > 0) {
            datasetNote.textContent = `Analysing incorrect attempts only. ${excluded.length} other students were ignored.`;
          }

          if (!data.subtopics || data.subtopics.length === 0) {
            const emptyState = document.createElement("p");
            emptyState.textContent = "No mistake tag data available for the selected students.";
            main.appendChild(emptyState);
            return;
          }

          data.subtopics.forEach((subtopic) => renderSubtopic(main, subtopic));
        } catch (error) {
          studentSummary.textContent = "Unable to load student information.";
          datasetNote.textContent = error instanceof Error ? error.message : String(error);
          const message = document.createElement("p");
          message.textContent = "Please verify that the JSON data file is available.";
          main.appendChild(message);
          console.error(error);
        }
      }

      init();
    </script>
  </body>
</html>
