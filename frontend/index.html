<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Topic Profiles</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        padding: 2.5rem clamp(1rem, 3vw, 3rem);
        background: inherit;
      }

      header {
        max-width: 1040px;
        margin: 0 auto 2.5rem;
        display: grid;
        gap: 1.25rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3.5vw, 2.75rem);
      }

      header p {
        margin: 0;
        color: #475569;
        font-size: 1rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      label {
        font-weight: 600;
        color: #1e293b;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      select {
        border-radius: 0.5rem;
        border: 1px solid #cbd5f5;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        background: #ffffff;
        color: inherit;
        min-width: 8rem;
      }

      main {
        max-width: 1040px;
        margin: 0 auto 4rem;
        display: grid;
        gap: 1.75rem;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }

      .summary-card {
        background: #ffffff;
        border-radius: 1rem;
        padding: 1.25rem;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        display: grid;
        gap: 0.35rem;
      }

      .summary-card h3 {
        margin: 0;
        font-size: 1rem;
        color: #1e293b;
      }

      .summary-card p {
        margin: 0;
        color: #475569;
        font-size: 0.95rem;
      }

      .topic-card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: clamp(1.25rem, 3vw, 2rem);
        display: grid;
        gap: 1.5rem;
      }

      .topic-header {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        justify-content: space-between;
        align-items: flex-start;
      }

      .topic-heading {
        display: grid;
        gap: 0.4rem;
      }

      .topic-heading h2 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 1.9rem);
      }

      .subheading {
        margin: 0;
        color: #64748b;
        font-size: 0.95rem;
      }

      .topic-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        align-items: center;
      }

      .metric {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: #e2e8f0;
        color: #334155;
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        font-size: 0.85rem;
      }

      .skill-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-radius: 999px;
        padding: 0.4rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .skill-advanced {
        background: rgba(22, 163, 74, 0.12);
        color: #15803d;
      }

      .skill-proficient {
        background: rgba(59, 130, 246, 0.12);
        color: #1d4ed8;
      }

      .skill-developing {
        background: rgba(249, 115, 22, 0.12);
        color: #c2410c;
      }

      .skill-support {
        background: rgba(239, 68, 68, 0.15);
        color: #b91c1c;
      }

      .skill-no-data {
        background: rgba(148, 163, 184, 0.2);
        color: #475569;
      }

      .subtopic-grid {
        display: grid;
        gap: 1rem;
      }

      .subtopic-card {
        background: #f8fafc;
        border-radius: 0.85rem;
        padding: 1.1rem clamp(1rem, 2vw, 1.5rem);
        display: grid;
        gap: 0.85rem;
      }

      .subtopic-header {
        display: flex;
        justify-content: space-between;
        gap: 0.85rem;
        flex-wrap: wrap;
        align-items: baseline;
      }

      .subtopic-title {
        margin: 0;
        font-size: 1.05rem;
      }

      .attempt-count {
        margin: 0;
        color: #475569;
        font-size: 0.85rem;
      }

      .subtopic-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .subtopic-stat {
        background: #e2e8f0;
        border-radius: 999px;
        color: #334155;
        font-size: 0.8rem;
        padding: 0.2rem 0.65rem;
      }

      .tag-table {
        display: grid;
        gap: 0.75rem;
      }

      .global-tags {
        background: #ffffff;
        border-radius: 1rem;
        padding: clamp(1.25rem, 3vw, 2rem);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        display: grid;
        gap: 1.25rem;
      }

      .global-tags header {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: baseline;
        justify-content: space-between;
      }

      .tag-summary {
        display: grid;
        gap: 0.75rem;
      }

      .tag-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .tag-button {
        border: none;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.12);
        color: #1d4ed8;
        padding: 0.35rem 0.8rem;
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .tag-button:hover,
      .tag-button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(29, 78, 216, 0.15);
        outline: none;
      }

      .tag-button.active {
        background: #1d4ed8;
        color: #ffffff;
      }

      .tag-count {
        font-size: 0.85rem;
        color: #334155;
        min-width: 3rem;
        text-align: right;
      }

      .question-list {
        border-top: 1px solid #e2e8f0;
        padding-top: 0.85rem;
        display: grid;
        gap: 0.75rem;
      }

      .question-heading {
        margin: 0;
        font-size: 0.95rem;
        color: #1e293b;
      }

      .question-card {
        background: #ffffff;
        border-radius: 0.75rem;
        padding: 0.85rem 1rem;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.25);
      }

      .question-card h4 {
        margin: 0 0 0.45rem;
        font-size: 0.95rem;
        color: #1e293b;
      }

      .question-card p {
        margin: 0.2rem 0;
        font-size: 0.85rem;
        color: #475569;
      }

      .question-meta {
        margin-top: 0.5rem;
        display: grid;
        gap: 0.25rem;
      }

      .empty-state {
        margin: 0;
        font-style: italic;
        color: #64748b;
        font-size: 0.9rem;
      }

      footer {
        max-width: 1040px;
        margin: 3rem auto 0;
        color: #475569;
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        body {
          padding: 1.5rem 1rem 2.5rem;
        }

        .topic-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .tag-row {
          align-items: flex-start;
        }

        .tag-count {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Student topic profiles</h1>
        <p id="student-summary">Loading student information…</p>
        <p id="dataset-note">Preparing dataset insights.</p>
      </div>
      <div class="controls">
        <label for="student-select">
          Student ID
          <select id="student-select" aria-label="Select student"></select>
        </label>
      </div>
    </header>
    <main id="content" aria-live="polite"></main>
    <footer>
      Mistake tagging logic is shared with <code>backend/app/ingest.py</code>. Skill
      levels are derived from the share of marks awarded per topic.
    </footer>
    
    <script>
      const numberFormatter = new Intl.NumberFormat("en-US");
      const percentFormatter = new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 1,
        minimumFractionDigits: 0,
      });
      const domParser = new DOMParser();
    
      function htmlToText(value) {
        if (value === null || value === undefined) return "";
        const raw = String(value).trim();
        if (!raw) return "";
        const parsed = domParser.parseFromString(raw, "text/html");
        const textContent = parsed.body.textContent || "";
        return textContent.replace(/\s+/g, " ").trim();
      }
    
      function numberForMath(value) {
        const numeric = Number(value);
        return Number.isFinite(numeric) ? numeric : 0;
      }
    
      function formatMark(value) {
        const raw = String(value ?? "").trim();
        if (!raw) return "—";
        const numeric = Number(raw);
        if (Number.isFinite(numeric)) {
          return numberFormatter.format(numeric);
        }
        return raw;
      }
    
      function classifySkill(accuracy) {
        if (accuracy === null || Number.isNaN(accuracy)) {
          return { label: "No score data", className: "skill-no-data", accuracy: null };
        }
        if (accuracy >= 85) {
          return { label: "Advanced", className: "skill-advanced", accuracy };
        }
        if (accuracy >= 65) {
          return { label: "Proficient", className: "skill-proficient", accuracy };
        }
        if (accuracy >= 40) {
          return { label: "Developing", className: "skill-developing", accuracy };
        }
        return { label: "Needs Support", className: "skill-support", accuracy };
      }
    
      function buildQuestion(record, subjectName, topicName, subtopicName) {
        const promptText =
          htmlToText(record.q_text) ||
          htmlToText(record.q_text1) ||
          "Question prompt unavailable.";
        const solutionText =
          htmlToText(record.correct_answer ?? record.solution ?? "") ||
          "";
        const studentText = htmlToText(record.answer);
    
        return {
          attemptId: record.answer_id || "",
          partId: record.part_id || "",
          prompt: promptText,
          solution: solutionText,
          studentAnswer: studentText || "No answer recorded.",
          markRaw: record.mark,
          markAwardedRaw: record.mark_awarded,
          topicName,
          subtopicName,
          subjectName,
          studentScore: record.student_score ?? "",
        };
      }
    
      function aggregateStudent(records) {
        const topicsMap = new Map();
        const globalTags = new Map();
        let totalAttempts = 0;
        let totalMistakes = 0;
    
        records.forEach((record) => {
          totalAttempts += 1;
          const isMistake = Number(record.is_mistake) === 1;
          if (isMistake) totalMistakes += 1;
    
          const topicName = (record.name ?? "").trim() || "Unlabelled topic";
          const subjectName = (record.subject_name ?? "").trim() || "Unknown subject";
          let topicEntry = topicsMap.get(topicName);
          if (!topicEntry) {
            topicEntry = {
              topicName,
              subjectName,
              totalMark: 0,
              totalMarkAwarded: 0,
              attempts: 0,
              mistakes: 0,
              subtopics: new Map(),
            };
            topicsMap.set(topicName, topicEntry);
          }
    
          topicEntry.attempts += 1;
          if (isMistake) topicEntry.mistakes += 1;
          topicEntry.totalMark += numberForMath(record.mark);
          topicEntry.totalMarkAwarded += numberForMath(record.mark_awarded);
    
          const subtopicName = (record.description ?? "").trim() || "General practice";
          let subtopicEntry = topicEntry.subtopics.get(subtopicName);
          if (!subtopicEntry) {
            subtopicEntry = {
              name: subtopicName,
              attemptCount: 0,
              mistakeCount: 0,
              tags: new Map(),
            };
            topicEntry.subtopics.set(subtopicName, subtopicEntry);
          }
    
          subtopicEntry.attemptCount += 1;
    
          const question = buildQuestion(record, subjectName, topicName, subtopicName);
    
          if (isMistake) {
            subtopicEntry.mistakeCount += 1;
            const rawCategory = (record.mistake_category ?? "").trim() || "Uncategorised";
            const normalized = rawCategory.toLowerCase() === "null" ? "Uncategorised" : rawCategory;
    
            let tagEntry = subtopicEntry.tags.get(normalized);
            if (!tagEntry) {
              tagEntry = { tag: normalized, count: 0, questions: [] };
              subtopicEntry.tags.set(normalized, tagEntry);
            }
            tagEntry.count += 1;
            tagEntry.questions.push(question);
    
            let globalEntry = globalTags.get(normalized);
            if (!globalEntry) {
              globalEntry = { tag: normalized, count: 0, questions: [] };
              globalTags.set(normalized, globalEntry);
            }
            globalEntry.count += 1;
            globalEntry.questions.push(question);
          }
        });
    
        const topics = Array.from(topicsMap.values())
          .map((topic) => {
            const accuracyRaw =
              topic.totalMark > 0 ? (topic.totalMarkAwarded / topic.totalMark) * 100 : null;
            const accuracy =
              accuracyRaw === null ? null : Math.round(accuracyRaw * 10) / 10;
            const skill = classifySkill(accuracy);
            const subtopics = Array.from(topic.subtopics.values())
              .map((subtopic) => ({
                ...subtopic,
                tags: Array.from(subtopic.tags.values()).sort((a, b) =>
                  b.count === a.count ? a.tag.localeCompare(b.tag) : b.count - a.count
                ),
              }))
              .sort((a, b) => a.name.localeCompare(b.name));
            return {
              subjectName: topic.subjectName,
              topicName: topic.topicName,
              questions_attempted: topic.attempts,
              mistake_attempts: topic.mistakes,
              skill,
              subtopics,
            };
          })
          .sort((a, b) => a.topicName.localeCompare(b.topicName));
    
        const tagSummary = Array.from(globalTags.values()).sort((a, b) =>
          b.count === a.count ? a.tag.localeCompare(b.tag) : b.count - a.count
        );
    
        const studentId = records.length > 0 ? String(records[0].student_id ?? "") : "";
    
        return {
          studentId,
          totalAttempts,
          totalMistakes,
          topics,
          tags: tagSummary,
        };
      }
    
      async function loadAttempts() {
        const response = await fetch("/attempts", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to load attempts: ${response.status}`);
        }
        return response.json();
      }
    
      function groupByStudent(records) {
        const map = new Map();
        records.forEach((record) => {
          const studentId = String(record.student_id ?? "").trim();
          if (!studentId) return;
          if (!map.has(studentId)) {
            map.set(studentId, []);
          }
          map.get(studentId).push(record);
        });
        return map;
      }
    
      function createSummaryCard(title, value, description) {
        const card = document.createElement("div");
        card.className = "summary-card";
    
        const heading = document.createElement("h3");
        heading.textContent = title;
        card.appendChild(heading);
    
        const mainValue = document.createElement("p");
        mainValue.style.fontWeight = "600";
        mainValue.style.fontSize = "1.4rem";
        mainValue.textContent = value;
        card.appendChild(mainValue);
    
        if (description) {
          const note = document.createElement("p");
          note.textContent = description;
          card.appendChild(note);
        }
    
        return card;
      }
    
      function renderStudentSummary(profile, container) {
        const section = document.createElement("section");
        section.className = "summary-grid";
    
        section.appendChild(
          createSummaryCard("Student ID", profile.studentId || "Unknown", "Selected learner")
        );
        section.appendChild(
          createSummaryCard(
            "Topics attempted",
            numberFormatter.format(profile.topics.length),
            "Unique curriculum topics engaged"
          )
        );
        section.appendChild(
          createSummaryCard(
            "Questions attempted",
            numberFormatter.format(profile.totalAttempts),
            "Total attempts recorded in CSV"
          )
        );
        section.appendChild(
          createSummaryCard(
            "Mistakes logged",
            numberFormatter.format(profile.totalMistakes),
            "Rows flagged with is_mistake = 1"
          )
        );
    
        container.appendChild(section);
      }
    
      function renderQuestionList(container, tagEntry, scopeLabel) {
        container.innerHTML = "";
        if (!tagEntry.questions || tagEntry.questions.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No individual questions are linked to this tag.";
          container.appendChild(empty);
          return;
        }
    
        const heading = document.createElement("p");
        heading.className = "question-heading";
        const readableTag = tagEntry.tag.replaceAll("_", " ");
        heading.textContent = `Questions tagged as “${readableTag}”${
          scopeLabel ? ` · ${scopeLabel}` : ""
        }`;
        container.appendChild(heading);
    
        tagEntry.questions.forEach((question, index) => {
          const card = document.createElement("div");
          card.className = "question-card";
    
          const title = document.createElement("h4");
          const parts = [];
          if (question.attemptId) parts.push(`#${question.attemptId}`);
          if (question.partId) parts.push(`Part ${question.partId}`);
          const attemptLabel = parts.length > 0 ? parts.join(" · ") : index + 1;
          title.textContent = `Attempt ${attemptLabel}`;
          card.appendChild(title);
    
          const prompt = document.createElement("p");
          const promptLabel = document.createElement("strong");
          promptLabel.textContent = "Question:";
          prompt.appendChild(promptLabel);
          prompt.append(` ${question.prompt}`);
          card.appendChild(prompt);
    
          const solution = document.createElement("p");
          const solutionLabel = document.createElement("strong");
          solutionLabel.textContent = "Model answer:";
          solution.appendChild(solutionLabel);
          solution.append(` ${question.solution || "Not provided in dataset."}`);
          card.appendChild(solution);
    
          const studentAnswer = document.createElement("p");
          const studentLabel = document.createElement("strong");
          studentLabel.textContent = "Student answer:";
          studentAnswer.appendChild(studentLabel);
          studentAnswer.append(` ${question.studentAnswer || "No response submitted."}`);
          card.appendChild(studentAnswer);
    
          const meta = document.createElement("div");
          meta.className = "question-meta";
    
          const location = document.createElement("p");
          const locationLabel = document.createElement("strong");
          locationLabel.textContent = "Location:";
          location.appendChild(locationLabel);
          location.append(
            ` ${question.topicName} · ${question.subtopicName} (${question.subjectName})`
          );
          meta.appendChild(location);
    
          const marks = document.createElement("p");
          const marksLabel = document.createElement("strong");
          marksLabel.textContent = "Marks:";
          marks.appendChild(marksLabel);
          const markText = `${formatMark(question.markAwardedRaw)} / ${formatMark(question.markRaw)}`;
          marks.append(` ${markText}`);
          meta.appendChild(marks);
    
          if (question.studentScore) {
            const score = document.createElement("p");
            const scoreLabel = document.createElement("strong");
            scoreLabel.textContent = "Recorded score:";
            score.appendChild(scoreLabel);
            score.append(` ${question.studentScore}`);
            meta.appendChild(score);
          }
    
          card.appendChild(meta);
          container.appendChild(card);
        });
      }
    
      function renderGlobalTags(profile, container) {
        if (!profile.tags.length) {
          return;
        }
    
        const section = document.createElement("section");
        section.className = "global-tags";
    
        const header = document.createElement("header");
        const title = document.createElement("h2");
        title.textContent = "Mistake categories across all topics";
        header.appendChild(title);
    
        const subtitle = document.createElement("p");
        subtitle.className = "subheading";
        subtitle.textContent = `${profile.tags.length} category${
          profile.tags.length === 1 ? "" : "ies"
        } captured in CSV`;
        header.appendChild(subtitle);
        section.appendChild(header);
    
        const table = document.createElement("div");
        table.className = "tag-summary";
    
        const questionList = document.createElement("div");
        questionList.className = "question-list";
        questionList.hidden = true;
        questionList.setAttribute("aria-hidden", "true");
    
        profile.tags.forEach((tagEntry) => {
          const row = document.createElement("div");
          row.className = "tag-row";
    
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tag-button";
          button.textContent = tagEntry.tag.replaceAll("_", " ");
          button.addEventListener("click", () => {
            const alreadyActive = button.classList.contains("active");
            table
              .querySelectorAll(".tag-button.active")
              .forEach((active) => active.classList.remove("active"));
    
            if (alreadyActive) {
              questionList.hidden = true;
              questionList.innerHTML = "";
              questionList.setAttribute("aria-hidden", "true");
              return;
            }
    
            button.classList.add("active");
            renderQuestionList(questionList, tagEntry, "all topics for this student");
            questionList.hidden = false;
            questionList.setAttribute("aria-hidden", "false");
          });
          row.appendChild(button);
    
          const count = document.createElement("span");
          count.className = "tag-count";
          count.textContent = `${tagEntry.count} mistake${tagEntry.count === 1 ? "" : "s"}`;
          row.appendChild(count);
    
          table.appendChild(row);
        });
    
        section.appendChild(table);
        section.appendChild(questionList);
        container.appendChild(section);
      }
    
      function renderSubtopic(subtopic) {
        const section = document.createElement("section");
        section.className = "subtopic-card";
    
        const header = document.createElement("div");
        header.className = "subtopic-header";
    
        const title = document.createElement("h3");
        title.className = "subtopic-title";
        title.textContent = subtopic.name;
        header.appendChild(title);
    
        section.appendChild(header);
    
        const stats = document.createElement("div");
        stats.className = "subtopic-stats";
    
        const attemptsStat = document.createElement("span");
        attemptsStat.className = "subtopic-stat";
        attemptsStat.textContent = `${subtopic.attemptCount} question${
          subtopic.attemptCount === 1 ? "" : "s"
        } attempted`;
        stats.appendChild(attemptsStat);
    
        const mistakesStat = document.createElement("span");
        mistakesStat.className = "subtopic-stat";
        mistakesStat.textContent = `${subtopic.mistakeCount} mistake${
          subtopic.mistakeCount === 1 ? "" : "s"
        }`;
        stats.appendChild(mistakesStat);
    
        section.appendChild(stats);
    
        const tagTable = document.createElement("div");
        tagTable.className = "tag-table";
    
        if (!subtopic.tags || subtopic.tags.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No mistake tags recorded for this subtopic.";
          section.appendChild(empty);
          return section;
        }
    
        const questionList = document.createElement("div");
        questionList.className = "question-list";
        questionList.hidden = true;
        questionList.setAttribute("aria-hidden", "true");
    
        subtopic.tags.forEach((tagEntry) => {
          const row = document.createElement("div");
          row.className = "tag-row";
    
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tag-button";
          button.textContent = tagEntry.tag.replaceAll("_", " ");
    
          button.addEventListener("click", () => {
            const alreadyActive = button.classList.contains("active");
            section
              .querySelectorAll(".tag-button.active")
              .forEach((activeButton) => activeButton.classList.remove("active"));
    
            if (alreadyActive) {
              questionList.hidden = true;
              questionList.innerHTML = "";
              questionList.setAttribute("aria-hidden", "true");
              return;
            }
    
            button.classList.add("active");
            renderQuestionList(questionList, tagEntry, subtopic.name);
            questionList.hidden = false;
            questionList.setAttribute("aria-hidden", "false");
          });
          row.appendChild(button);
    
          const count = document.createElement("span");
          count.className = "tag-count";
          count.textContent = `${tagEntry.count} mistake${tagEntry.count === 1 ? "" : "s"}`;
          row.appendChild(count);
    
          tagTable.appendChild(row);
        });
    
        section.appendChild(tagTable);
        section.appendChild(questionList);
        return section;
      }
    
      function renderTopic(topic) {
        const article = document.createElement("article");
        article.className = "topic-card";
    
        const header = document.createElement("div");
        header.className = "topic-header";
    
        const heading = document.createElement("div");
        heading.className = "topic-heading";
    
        const title = document.createElement("h2");
        title.textContent = `${topic.topicName} (${topic.subjectName})`;
        heading.appendChild(title);
    
        const subheading = document.createElement("p");
        subheading.className = "subheading";
        subheading.textContent = `${topic.subtopics.length} subtopic${
          topic.subtopics.length === 1 ? "" : "s"
        } attempted`;
        heading.appendChild(subheading);
    
        header.appendChild(heading);
    
        const metrics = document.createElement("div");
        metrics.className = "topic-metrics";
    
        const skillChip = document.createElement("span");
        skillChip.className = `skill-chip ${topic.skill.className}`;
        if (topic.skill.accuracy === null) {
          skillChip.textContent = topic.skill.label;
        } else {
          skillChip.textContent = `${topic.skill.label} · ${percentFormatter.format(
            topic.skill.accuracy
          )}%`;
        }
        metrics.appendChild(skillChip);
    
        const attempts = document.createElement("span");
        attempts.className = "metric";
        attempts.textContent = `${topic.questions_attempted} question${
          topic.questions_attempted === 1 ? "" : "s"
        } attempted`;
        metrics.appendChild(attempts);
    
        const mistakes = document.createElement("span");
        mistakes.className = "metric";
        mistakes.textContent = `${topic.mistake_attempts} mistake${
          topic.mistake_attempts === 1 ? "" : "s"
        } recorded`;
        metrics.appendChild(mistakes);
    
        header.appendChild(metrics);
        article.appendChild(header);
    
        const subtopicGrid = document.createElement("div");
        subtopicGrid.className = "subtopic-grid";
    
        if (!topic.subtopics || topic.subtopics.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No subtopics available for this topic.";
          subtopicGrid.appendChild(empty);
        } else {
          topic.subtopics.forEach((subtopic) => {
            subtopicGrid.appendChild(renderSubtopic(subtopic));
          });
        }
    
        article.appendChild(subtopicGrid);
        return article;
      }
    
      function renderStudentProfile(profile, container) {
        container.innerHTML = "";
    
        if (!profile || !profile.topics || profile.topics.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No attempts found for this student.";
          container.appendChild(empty);
          return;
        }
    
        renderStudentSummary(profile, container);
        renderGlobalTags(profile, container);
    
        profile.topics.forEach((topic) => {
          container.appendChild(renderTopic(topic));
        });
      }
    
      async function init() {
        const main = document.getElementById("content");
        const studentSummary = document.getElementById("student-summary");
        const datasetNote = document.getElementById("dataset-note");
        const select = document.getElementById("student-select");
    
        try {
          const records = await loadAttempts();
          const byStudent = groupByStudent(records);
          const studentIds = Array.from(byStudent.keys()).sort((a, b) => {
            const numA = Number(a);
            const numB = Number(b);
            if (Number.isFinite(numA) && Number.isFinite(numB)) {
              return numA - numB;
            }
            return a.localeCompare(b);
          });
    
          if (studentIds.length === 0) {
            studentSummary.textContent = "No student attempts present in the database.";
            datasetNote.textContent = "Verify that the CSV has been ingested via /ingest.";
            return;
          }
    
          select.innerHTML = "";
          studentIds.forEach((id) => {
            const option = document.createElement("option");
            option.value = id;
            option.textContent = id;
            select.appendChild(option);
          });
    
          datasetNote.textContent = `${numberFormatter.format(
            records.length
          )} total attempts loaded from CSV.`;
    
          const updateStudent = (id) => {
            const studentRecords = byStudent.get(String(id));
            if (!studentRecords) {
              studentSummary.textContent = `Student #${id} has no recorded attempts.`;
              renderStudentProfile(null, main);
              return;
            }
            const profile = aggregateStudent(studentRecords);
            studentSummary.textContent = `Student #${profile.studentId} across ${numberFormatter.format(
              profile.topics.length
            )} topic${profile.topics.length === 1 ? "" : "s"}.`;
            renderStudentProfile(profile, main);
          };
    
          select.addEventListener("change", (event) => {
            updateStudent(event.target.value);
          });
    
          const defaultStudent = select.value || studentIds[0];
          updateStudent(defaultStudent);
        } catch (error) {
          studentSummary.textContent = "Unable to load student information.";
          datasetNote.textContent = error instanceof Error ? error.message : String(error);
          const message = document.createElement("p");
          message.textContent = "Please verify that the backend is running and the CSV has been ingested.";
          main.appendChild(message);
          console.error(error);
        }
      }
    
      init();
    </script>

  </body>
</html>
