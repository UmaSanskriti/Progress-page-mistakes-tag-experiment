<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtopic Mistake Tags</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #1f2933;
        background-color: #f8fafc;
      }

      body {
        margin: 0;
        padding: 2rem;
        background-color: inherit;
      }

      h1 {
        margin-top: 0;
      }

      .controls {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-bottom: 1.5rem;
      }

      label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #52606d;
      }

      select,
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #cbd2d9;
        font-size: 1rem;
        margin-top: 0.35rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      }

      thead {
        background: #e4ebf5;
      }

      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid #d2ddec;
      }

      th {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: #334155;
        letter-spacing: 0.05em;
      }

      tbody tr:hover {
        background-color: #f1f5f9;
      }

      .tag-pill {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        font-size: 0.85rem;
        background: #eef2ff;
        color: #4338ca;
      }

      #status {
        margin-bottom: 1rem;
        font-size: 0.95rem;
        color: #52606d;
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }

        thead tr {
          display: none;
        }

        tbody tr {
          margin-bottom: 1rem;
          box-shadow: 0 2px 4px rgba(15, 23, 42, 0.1);
        }

        tbody td {
          border: none;
          position: relative;
          padding-left: 50%;
        }

        tbody td::before {
          position: absolute;
          left: 1rem;
          width: 45%;
          white-space: nowrap;
          font-weight: bold;
          content: attr(data-label);
        }
      }
    </style>
  </head>
  <body>
    <h1>Subtopic Mistake Tag Dashboard</h1>
    <p id="status">Loading data…</p>
    <section class="controls">
      <label>
        Filter by Tag
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </label>
      <label>
        Filter by Subtopic
        <input
          id="subtopic-filter"
          type="search"
          placeholder="e.g. magnets"
        />
      </label>
      <label>
        Sort by
        <select id="sort-by">
          <option value="subtopic">Subtopic</option>
          <option value="tag">Tag</option>
          <option value="count">Count</option>
        </select>
      </label>
      <label>
        Sort direction
        <select id="sort-dir">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </label>
    </section>

    <table aria-describedby="status">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Topic</th>
          <th>Subtopic</th>
          <th>Tag</th>
          <th>Attempts</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>

    <script>
      const statusEl = document.getElementById("status");
      const tagFilter = document.getElementById("tag-filter");
      const subtopicFilter = document.getElementById("subtopic-filter");
      const sortBy = document.getElementById("sort-by");
      const sortDir = document.getElementById("sort-dir");
      const resultsBody = document.getElementById("results");

      async function loadData() {
        const params = new URLSearchParams();
        if (tagFilter.value) params.set("tag", tagFilter.value);
        if (subtopicFilter.value)
          params.set("subtopic", subtopicFilter.value.trim());
        params.set("sort_by", sortBy.value);
        params.set("sort_dir", sortDir.value);

        statusEl.textContent = "Loading data…";
        resultsBody.innerHTML = "";

        try {
          const response = await fetch(`/subtopics?${params.toString()}`);
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }
          const data = await response.json();
          statusEl.textContent = `Showing ${data.length} rows`;

          if (!tagFilter.dataset.initialised) {
            populateTagFilter(data);
            tagFilter.dataset.initialised = "true";
          }

          renderTable(data);
        } catch (error) {
          console.error(error);
          statusEl.textContent = `Unable to load data: ${error.message}`;
        }
      }

      function populateTagFilter(data) {
        const uniqueTags = Array.from(new Set(data.map((item) => item.tag))).sort();
        for (const tag of uniqueTags) {
          const option = document.createElement("option");
          option.value = tag;
          option.textContent = tag.replace(/_/g, " ");
          tagFilter.appendChild(option);
        }
      }

      function renderTable(data) {
        if (!data.length) {
          resultsBody.innerHTML = `<tr><td colspan="5">No results found.</td></tr>`;
          return;
        }

        const rows = data
          .map(
            (row) => `
            <tr>
              <td data-label="Subject">${row.subject}</td>
              <td data-label="Topic">${row.topic}</td>
              <td data-label="Subtopic">${row.subtopic}</td>
              <td data-label="Tag"><span class="tag-pill">${row.tag.replace(
                /_/g,
                " "
              )}</span></td>
              <td data-label="Attempts">${row.count}</td>
            </tr>`
          )
          .join("");

        resultsBody.innerHTML = rows;
      }

      tagFilter.addEventListener("change", loadData);
      sortBy.addEventListener("change", loadData);
      sortDir.addEventListener("change", loadData);
      subtopicFilter.addEventListener("input", debounce(loadData, 300));

      function debounce(callback, delay = 250) {
        let timeoutId;
        return (...args) => {
          window.clearTimeout(timeoutId);
          timeoutId = window.setTimeout(() => callback.apply(this, args), delay);
        };
      }

      loadData();
    </script>
  </body>
</html>
